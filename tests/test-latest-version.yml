name: Test latest version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: latest
          github-token: ${{ github.token }}
      - name: Assert installed-version output is set
        env:
          INSTALLED: ${{ steps.action.outputs.installed-version }}
        run: |
          echo "installed-version: $INSTALLED"
          if [ -z "$INSTALLED" ]; then
            echo "FAIL: installed-version output is empty"
            exit 1
          fi
          echo "PASS: installed-version is '$INSTALLED'"
      - name: Assert gh binary is available and works
        run: |
          echo "gh version output:"
          gh --version
          if ! gh --version > /dev/null 2>&1; then
            echo "FAIL: gh binary is not functional"
            exit 1
          fi
          echo "PASS: gh binary works"
      - name: Assert installed version matches output
        env:
          INSTALLED: ${{ steps.action.outputs.installed-version }}
        run: |
          echo "Expected version from output: $INSTALLED"
          ACTUAL_VERSION=$(gh --version | head -n1 | awk '{print $3}')
          echo "Actual gh version: $ACTUAL_VERSION"
          INSTALLED_STRIPPED="${INSTALLED#v}"
          ACTUAL_STRIPPED="${ACTUAL_VERSION#v}"
          if [ "$INSTALLED_STRIPPED" != "$ACTUAL_STRIPPED" ]; then
            echo "FAIL: installed-version output '$INSTALLED' does not match actual gh version '$ACTUAL_VERSION'"
            exit 1
          fi
          echo "PASS: versions match"
