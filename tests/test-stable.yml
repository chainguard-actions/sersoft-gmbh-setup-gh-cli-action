name: Test stable gh CLI installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: stable
          github-token: ${{ github.token }}
      - name: Assert installed-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.installed-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: installed-version output is empty"
            exit 1
          fi
          echo "PASS: installed-version=$ACTUAL"
      - name: Assert gh binary is available
        run: |
          if ! command -v gh &>/dev/null; then
            echo "FAIL: gh binary not found in PATH"
            exit 1
          fi
          GH_VERSION="$(gh --version)"
          echo "gh version: $GH_VERSION"
          echo "PASS"
      - name: Assert installed version matches output
        env:
          EXPECTED: ${{ steps.action.outputs.installed-version }}
        run: |
          echo "expected: $EXPECTED"
          ACTUAL_VERSION="$(gh --version | head -n1 | awk '{print $3}')"
          echo "actual from binary: $ACTUAL_VERSION"
          # The output may include a 'v' prefix; normalize both
          NORM_EXPECTED="${EXPECTED#v}"
          NORM_ACTUAL="${ACTUAL_VERSION#v}"
          if [ "$NORM_EXPECTED" != "$NORM_ACTUAL" ]; then
            echo "FAIL: installed-version output '$NORM_EXPECTED' does not match binary version '$NORM_ACTUAL'"
            exit 1
          fi
          echo "PASS"
