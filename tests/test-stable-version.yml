name: Test stable version install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: stable
      - name: Assert installed-version output is set
        env:
          INSTALLED_VERSION: ${{ steps.action.outputs.installed-version }}
        run: |
          echo "installed-version: $INSTALLED_VERSION"
          if [ -z "$INSTALLED_VERSION" ]; then
            echo "FAIL: installed-version output is empty"
            exit 1
          fi
          echo "PASS: installed-version=$INSTALLED_VERSION"
      - name: Assert gh is available and version matches
        env:
          INSTALLED_VERSION: ${{ steps.action.outputs.installed-version }}
        run: |
          ACTUAL_VERSION=$(gh --version | head -n1 | awk '{print $3}')
          echo "gh reported version: $ACTUAL_VERSION"
          echo "installed-version output: $INSTALLED_VERSION"
          if [ "$ACTUAL_VERSION" != "$INSTALLED_VERSION" ]; then
            echo "FAIL: gh version '$ACTUAL_VERSION' does not match installed-version output '$INSTALLED_VERSION'"
            exit 1
          fi
          echo "PASS"
