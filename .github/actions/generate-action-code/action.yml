name: Generate Action Code
description: Generates the action code

runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 20
        check-latest: true
        cache: 'npm'
    - name: Generate action code
      shell: bash
      run: |
        npm clean-install
        npm run build
        npm run pack
